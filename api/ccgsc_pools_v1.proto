// author: hermes MiniMax-M3 for Claude Opus 5.5
// date: 2026-11-17
// status: RECONCILED (T42 F10 2026-11-18; T100 2026-11-21)
// basis: GRILL_WWPP_R1.md rows WWPP-R32.1..R32.9, WWPP-R33.1, WWPP-R34.1, WWPP-R35.1, WWPP-R35.2, WWPP-R36.1, WWPP-R36.2
// scope: browser thread pool and browser process pool (tab / tab host unit); no shared memory, no MPI.
// relation: mirrors F:/tmp/wwpp/api/thread_pool_v1.openapi.yaml and F:/tmp/wwpp/api/process_pool_v1.openapi.yaml.
// field naming: proto3 snake_case; the canonical JSON mapping is lowerCamelCase, so every field here is the OpenAPI field of the same name.
// transports: every operation is unary except Events, which is server-streaming; the gRPC surface is developer-to-server only.
//
// Reconciliation of 2026-11-21 (T100 artifact ownership), driven by the
// generated bindings of internal/grpcapi, which had drifted ahead of this file:
//   * RefreshToken takes RefreshTokenRequest; CreateKeyRequest carries the
//     flattened auth user; ApiKey carries user_id; PolicySelection carries the
//     per-field values and chosenBy maps; ChainEntry carries the F3 chain
//     fields; Job.chainEntries is the entry count (int64) with chosen_policy;
//     GetResultsBulk returns ResultsPage and drops BulkArchive; WebhookConfig
//     drops events; Capabilities drops webhooks; the F8 upload scan report and
//     the artifact review state are on Artifact.
//   * DeleteArtifact (T100): the caller drops its own reference to a shared
//     content-addressed artifact blob; the blob is deleted when no reference
//     remains.

syntax = "proto3";

package ccgsc.pools.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option java_package = "org.ccgsc.pools.v1";
option java_multiple_files = true;
option go_package = "github.com/ccgsc/pools/ccgsc/pools/v1;ccgscpoolsv1";

// ---------------------------------------------------------------- services

// ThreadPool schedules compute tasks onto browser thread-pool workers.
service ThreadPool {
  // Exchange a developer API key for a 15-minute JWT.
  rpc ExchangeToken(TokenRequest) returns (TokenResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (TokenResponse);
  rpc CreateKey(CreateKeyRequest) returns (ApiKey);

  // Upload a content-addressed artifact by sha256, in resumable chunks.
  // T100: identical bytes uploaded by another owner join the same blob and add
  // a per-owner reference for that caller.
  rpc UploadArtifact(ArtifactUploadRequest) returns (Artifact);
  // T100: allowed for a caller that holds a reference, for a Store A admin, or
  // for a contributor tab under the worker rule.
  rpc GetArtifact(GetArtifactRequest) returns (ArtifactData);
  // T100: remove the caller's reference; the blob is deleted when no reference
  // remains.
  rpc DeleteArtifact(DeleteArtifactRequest) returns (DeleteArtifactResponse);

  // Submit a job.
  rpc CreateJob(CreateJobRequest) returns (Job);

  // Fetch job state, progress and lint warnings.
  rpc GetJob(GetJobRequest) returns (Job);
  rpc GetJobChain(GetJobChainRequest) returns (ChainReport);
  rpc GetMerkleCheckpoints(GetMerkleCheckpointsRequest) returns (MerkleReport);

  // Cancel a queued or running job.
  rpc CancelJob(CancelJobRequest) returns (Job);

  // Read task results in as_completed order.
  rpc GetResults(GetResultsRequest) returns (ResultsPage);

  // Download all job results as one cursor page of results.
  rpc GetResultsBulk(GetResultsBulkRequest) returns (ResultsPage);

  // Lint a job request without submitting it.
  rpc ValidateJob(ValidateJobRequest) returns (ValidationResult);

  // Server limits, GPU support and per-key quotas.
  rpc GetCapabilities(GetCapabilitiesRequest) returns (Capabilities);

  // Live server event stream; server-streaming.
  rpc StreamEvents(EventStreamRequest) returns (stream EventMessage);
}

// ProcessPool schedules compute tasks onto browser process-pool workers, where a
// worker unit is a browser tab or a tab host (wwHost), and adds the session API:
// open a session, stream tasks in batches, close the session.
service ProcessPool {
  // Exchange a developer API key for a 15-minute JWT.
  rpc ExchangeToken(TokenRequest) returns (TokenResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (TokenResponse);
  rpc CreateKey(CreateKeyRequest) returns (ApiKey);

  // Upload a content-addressed artifact by sha256, in resumable chunks.
  // T100: identical bytes uploaded by another owner join the same blob and add
  // a per-owner reference for that caller.
  rpc UploadArtifact(ArtifactUploadRequest) returns (Artifact);
  // T100: allowed for a caller that holds a reference, for a Store A admin, or
  // for a contributor tab under the worker rule.
  rpc GetArtifact(GetArtifactRequest) returns (ArtifactData);
  // T100: remove the caller's reference; the blob is deleted when no reference
  // remains.
  rpc DeleteArtifact(DeleteArtifactRequest) returns (DeleteArtifactResponse);

  // Submit a job. group_by, pin and rerun_percent are process-pool additions.
  rpc CreateJob(CreateJobRequest) returns (Job);

  // Fetch job state, progress and lint warnings.
  rpc GetJob(GetJobRequest) returns (Job);
  rpc GetJobChain(GetJobChainRequest) returns (ChainReport);
  rpc GetMerkleCheckpoints(GetMerkleCheckpointsRequest) returns (MerkleReport);

  // Cancel a queued or running job.
  rpc CancelJob(CancelJobRequest) returns (Job);

  // Read task results in as_completed order.
  rpc GetResults(GetResultsRequest) returns (ResultsPage);

  // Download all job results as one cursor page of results.
  rpc GetResultsBulk(GetResultsBulkRequest) returns (ResultsPage);

  // Lint a job request without submitting it.
  rpc ValidateJob(ValidateJobRequest) returns (ValidationResult);

  // Open a process-pool session that leases tabs and keeps them warm.
  rpc OpenSession(OpenSessionRequest) returns (Session);

  // Fetch session state, leased tabs, warm state and progress.
  rpc GetSession(GetSessionRequest) returns (Session);

  // Stream tasks into an open session, in batches.
  rpc StreamSessionTasks(StreamSessionTasksRequest) returns (SessionTaskBatch);

  // Close a session and return its tabs to the pool.
  rpc CloseSession(CloseSessionRequest) returns (Session);

  // Server limits, GPU support, session limits and per-key quotas.
  rpc GetCapabilities(GetCapabilitiesRequest) returns (Capabilities);

  // Live server event stream; server-streaming.
  rpc StreamEvents(EventStreamRequest) returns (stream EventMessage);
}

// ---------------------------------------------------------------- auth

message TokenRequest {
  // Raw developer API key; shown once and stored hashed.
  string api_key = 1;
  // Requested scopes, intersected with the key scopes.
  repeated string scopes = 2;
}

message TokenResponse {
  string access_token = 1;
  string token_type = 2;
  // Token lifetime in seconds; default 900.
  int64 expires_in = 3;
  google.protobuf.Timestamp expires_at = 4;
  repeated string scopes = 5;
  // Server id component of a job id.
  string server_id = 6;
  string pool_id = 7;
}

message RefreshTokenRequest {
  // The refresh token issued together with the access token; the server
  // issues none yet and refuses the call as not implemented.
  string refresh_token = 1;
  repeated string scopes = 2;
}

message CreateKeyRequest {
  // User id of the new key owner.
  string user_id = 1;
  // Account store of the new key owner, A or B.
  string account_store = 2;
  // Roles of the new key owner.
  repeated string roles = 3;
  // Requested scopes.
  repeated string scopes = 4;
}

message ApiKey {
  string api_key = 1;
  string key_id = 2;
  // User id of the key owner.
  string user_id = 3;
}














// ---------------------------------------------------------------- artifacts

message ArtifactUploadRequest {
  // Lowercase hex sha256 of the complete object.
  string sha256 = 1;
  // Byte offset at which this chunk starts.
  int64 upload_offset = 2;
  // Total artifact length in bytes when known up front.
  int64 upload_length = 3;
  // Chunk bytes; empty when the chunk was already accepted.
  bytes chunk = 4;
  // Chunk range, for example "bytes 0-65535/1048576".
  string content_range = 5;
  string content_type = 6;
}

message GetArtifactRequest {
  string artifact_id = 1;
}

message ArtifactData {
  string artifact_id = 1;
  string sha256 = 2;
  string content_type = 3;
  bytes data = 4;
}

// T100: the caller drops its own reference to the artifact.
message DeleteArtifactRequest {
  // Artifact id, identical to the lowercase hex sha256.
  string artifact_id = 1;
}

message DeleteArtifactResponse {
  string artifact_id = 1;
  string sha256 = 2;
  // True when the caller held a reference and it was removed.
  bool removed = 3;
  // True when no reference remained and the blob was deleted.
  bool blob_deleted = 4;
  // Number of references that remain after this delete.
  int64 remaining_references = 5;
}

message Artifact {
  // Artifact id, identical to the lowercase hex sha256.
  string artifact_id = 1;
  string sha256 = 2;
  int64 size_bytes = 3;
  int64 received_bytes = 4;
  int64 next_offset = 5;
  bool complete = 6;
  string content_type = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp expires_at = 9;
  // Key id of the first uploader, the creator of the blob (T100 keeps it).
  string owner = 10;
  // Upload scan report of the module, when the scan ran (WO T42 F8).
  UploadScanReport scan = 11;
  // Admin review state: pending, approved, rejected or not-required.
  string review_state = 12;
  string review_reason = 13;
  int64 review_quorum = 14;
}

// One finding of the upload scan (WO T42 F8).
message ScanFinding {
  string code = 1;
  // info, warning or error.
  string severity = 2;
  string message = 3;
  string detail = 4;
}

// The result of the upload scan of one module artifact (WO T42 F8).
message UploadScanReport {
  string artifact_id = 1;
  // wasm, js or unknown.
  string kind = 2;
  int64 size_bytes = 3;
  string sha256 = 4;
  bool ok = 5;
  repeated string imports = 6;
  repeated ScanFinding findings = 7;
  google.protobuf.Timestamp scanned_at = 8;
}

// ---------------------------------------------------------------- job model

message TaskInput {
  oneof source {
    // Inline input below 256 KiB.
    bytes inline = 1;
    // Inline JSON input.
    google.protobuf.Struct json = 2;
    // Reference to a stored artifact.
    string artifact_id = 3;
  }
}

message TaskSpec {
  string task_id = 1;
  TaskInput input = 2;
  int64 timeout_ms = 3;
}

message SplitSpec {
  string artifact_id = 1;
  // Number of tasks derived from the artifact.
  int64 count = 2;
  // Implemented HTTP split formats: bytes and range (integer start/end, end exclusive).
  // rows and records remain reserved.
  string format = 3;
  // Slice size per task in bytes, or integer units for range; final slice may be shorter.
  int64 chunksize = 4;
}

// Keep a group of tasks inside one process, that is one tab or one tab host.
message GroupBy {
  // none, tab or host.
  string mode = 1;
  // Grouping key, usually a field of the task input.
  string key = 2;
  int64 max_groups = 3;
}

// Pin a job or a session batch to a session, to tabs or to tab hosts.
message Pin {
  string session_id = 1;
  repeated string tab_ids = 2;
  repeated string host_ids = 3;
}

// Server-side tamper evidence request; an admin may switch the option off, then
// it is simply unavailable.
message TamperEvidenceOption {
  // none, security-log, per-job-chain or merkle.
  string mode = 1;
  bool chain_per_job = 2;
}

// Request for upload checks on developer code; the admin decides which checks run.
message UploadCheckOption {
  // none, format-size-hash, import-permission-scan, review-gate, malware-abuse-scan or all.
  string mode = 1;
  bool require_review = 2;
}

// Peer-to-peer sharing request; hash-addressed sharing only, results always go
// to the server.
message P2POptions {
  bool enabled = 1;
  repeated string peers = 2;
  // Always hash-addressed-only.
  string share_mode = 3;
  // Always true; results always return to the server.
  bool results_to_server = 4;
}

// dew signed lease receipt request; dew is on by default with a 24 h window.
message DewOptions {
  bool enabled = 1;
  int64 receipt_window_seconds = 2;
}

message JobOptions {
  int64 task_timeout_ms = 1;
  int64 max_task_bytes = 2;
  repeated string tags = 3;
  // Use a developer comparator on a worker instead of exact hash equality.
  bool tolerance_compare = 4;
  string comparator_artifact_id = 5;
  TamperEvidenceOption tamper_evidence = 6;
  UploadCheckOption upload_checks = 7;
  P2POptions p2p = 8;
  DewOptions dew = 9;
}

message WebhookConfig {
  string url = 1;
  string secret = 2;
}


message CreateJobRequest {
  // sha256 artifact ids of the module code, WASM or JS, that workers must run.
  repeated string module_artifact_ids = 1;
  // Convenience alias for a single module artifact.
  string module_sha256 = 2;
  // Inline task list, mutually exclusive with split.
  repeated TaskSpec tasks = 3;
  SplitSpec split = 4;
  // Tasks grouped per worker round trip. Presence is explicit, because the
  // engine tells "omitted" from "explicit zero" apart while it resolves the
  // admin policy.
  optional int64 batch_size = 5;
  // Map of artifact id to per-task slice size in bytes.
  map<string, int64> chunksize = 6;
  // cpu, gpu or gpu-preferred; GPU tasks run only on GPU-capable tabs.
  optional string needs = 7;
  // partial, fail-fast or threshold.
  optional string policy = 8;
  // Failure ratio that trips the threshold policy.
  optional double threshold = 9;
  // Attempts per task before quarantine; default 3.
  optional int64 max_attempts = 10;
  // low, normal or high; high is honoured only when the admin allows it.
  optional string priority = 11;
  // Process-pool addition: keep a group of tasks inside one process.
  GroupBy group_by = 12;
  // Process-pool addition: bind the job to a session, tabs or hosts.
  Pin pin = 13;
  // Share of tasks in percent that the server re-sends to other workers and
  // compares by exact hash; an admin may refuse, then the job runs without
  // re-runs. The server never runs developer code.
  optional double rerun_percent = 14;
  JobOptions options = 15;
  google.protobuf.Struct metadata = 16;
  // Client key; resubmitting the same key returns the original job.
  string idempotency_key = 17;
  WebhookConfig webhook = 18;
}

message GetJobRequest {
  // Job id in the form <serverId>.<poolId>.<jobId>.
  string job_id = 1;
}

message CancelJobRequest {
  string job_id = 1;
  string reason = 2;
  int64 grace_ms = 3;
}

message ValidateJobRequest {
  CreateJobRequest request = 1;
}

message JobProgress {
  int64 total = 1;
  int64 completed = 2;
  int64 failed = 3;
  int64 queued = 4;
  int64 running = 5;
}

message Job {
  // Job id in the form <serverId>.<poolId>.<jobId>.
  string job_id = 1;
  string server_id = 2;
  string pool_id = 3;
  // queued, running, completed, failed, partial or cancelled.
  string state = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  // cpu, gpu or gpu-preferred.
  string needs = 8;
  // partial, fail-fast or threshold.
  string policy = 9;
  int64 max_attempts = 10;
  // low, normal or high.
  string priority = 11;
  // Process-pool session that owns this job, when it was opened through the
  // session API.
  string session_id = 12;
  GroupBy group_by = 13;
  Pin pin = 14;
  // Re-run share actually applied; lower than requested when the admin refused
  // or trimmed it.
  double rerun_percent = 15;
  JobProgress progress = 16;
  repeated Warning warnings = 17;
  string result_cursor = 18;
  string config_version = 19;
  string chain_mode = 20;
  string chain_head = 21;
  // Number of entries of the per-job hash chain.
  int64 chain_entries = 22;
  PolicySelection chosen_policy = 23;
  bool audit_gap = 24;
}

// The policy the admin configuration resolved for one job: the raw JSON value
// of every resolved field and the layer that chose it.
message PolicySelection {
  // Field name to raw JSON value.
  map<string, string> values = 1;
  // Field name to the choosing layer, pool-default or developer.
  map<string, string> chosen_by = 2;
}

message Warning {
  // For example tasks-too-small.
  string code = 1;
  // info, warning or error.
  string severity = 2;
  string message = 3;
  string path = 4;
  string hint = 5;
}

message ValidationResult {
  bool valid = 1;
  repeated Warning warnings = 2;
  int64 estimated_tasks = 3;
  repeated string device_classes = 4;
}

// ---------------------------------------------------------------- results

message TaskOutput {
  oneof source {
    // Small result inline.
    bytes inline = 1;
    // Small JSON result inline.
    google.protobuf.Struct json = 2;
    // Large result by URL.
    string url = 3;
    // Large result by artifact id.
    string artifact_id = 4;
  }
}

// dew signed lease receipt covering the leased tasks and their input hashes.
message LeaseReceipt {
  string receipt_id = 1;
  repeated string task_ids = 2;
  repeated string input_hashes = 3;
  google.protobuf.Timestamp deadline = 4;
  google.protobuf.Timestamp issued_at = 5;
  // 24 h window by default.
  int64 window_seconds = 6;
  // For example ed25519.
  string algorithm = 7;
  string key_id = 8;
  // Base64 signature over the receipt fields.
  string signature = 9;
}

// Re-run check outcome; the server compares exact hashes only and never runs
// developer code.
message Verification {
  bool rerun = 1;
  bool hash_match = 2;
  bool tolerance_match = 3;
  bool canary_ran = 4;
  string canary_state = 5;
  bool canary_ok = 6;
  bool trust_complete = 7;
  bool rerun_ok = 8;
  bool flagged = 9;
  string flag_reason = 10;
}

message TaskResult {
  string job_id = 1;
  string task_id = 2;
  // done or failed.
  string status = 3;
  int64 attempts = 4;
  int64 duration_ms = 5;
  TaskOutput output = 6;
  ErrorDetail error = 7;
  google.protobuf.Timestamp completed_at = 8;
  // True when the result arrived after job end, in the dead-letter store.
  bool late = 9;
  LeaseReceipt lease_receipt = 10;
  Verification verification = 11;
}

message GetResultsRequest {
  string job_id = 1;
  // Opaque pagination cursor over as_completed results.
  string cursor = 2;
  // Maximum number of results per page.
  int64 limit = 3;
  // Include failed task records; the server default is true.
  optional bool include_failed = 4;
}

message ResultsPage {
  // Always as_completed.
  string order = 1;
  repeated TaskResult items = 2;
  string next_cursor = 3;
  bool has_more = 4;
  string chain_head = 5;
  int64 chain_entries = 6;
  bool audit_gap = 7;
}

// The bulk route answers the same cursor page of results as GetResults; the
// shipped HTTP route GET /{pool}/v1/jobs/{jobId}/results:bulk is a paged
// export, not a tar archive, so the BulkArchive message is gone together with
// its only caller (WO T42 F10 reconciliation).
message GetResultsBulkRequest {
  string job_id = 1;
  // Include failed task records; the server default is true.
  optional bool include_failed = 2;
  // Opaque pagination cursor over as_completed results.
  string cursor = 3;
  // Maximum number of results per page; the server default is 100.
  int64 limit = 4;
}

// One entry of the per-job hash chain (F3).
message ChainEntry {
  uint64 seq = 1;
  string job_id = 2;
  string task_id = 3;
  int64 result_index = 4;
  string result_sha256 = 5;
  string worker_id = 6;
  google.protobuf.Timestamp at = 7;
  string prev = 8;
  string hash = 9;
}

message ChainVerification {
  string job_id = 1;
  bool valid = 2;
  string mode = 3;
  int64 entries = 4;
  string head = 5;
  string reason = 6;
  int64 broken_at = 7;
}

// Developer-owned per-run chain: code, input, result or fail-open gap.
message RunAuditEntry {
  uint64 seq = 1;
  string kind = 2;
  string job_id = 3;
  string task_id = 4;
  int64 ref_index = 5;
  string sha256 = 6;
  string worker_id = 7;
  google.protobuf.Timestamp at = 8;
  string prev = 9;
  string hash = 10;
}

message ChainReport {
  string job_id = 1;
  string mode = 2;
  string head = 3;
  repeated ChainEntry entries = 4;
  ChainVerification verification = 5;
  repeated RunAuditEntry run_entries = 6;
  bool audit_gap = 7;
}

message MerkleLeaf {
  string job_id = 1;
  string tip = 2;
}

message MerkleCheckpoint {
  uint64 seq = 1;
  google.protobuf.Timestamp at = 2;
  string root = 3;
  string prev_root = 4;
  string prev_hash = 5;
  string hash = 6;
  int64 job_count = 7;
  repeated MerkleLeaf leaves = 8;
}

message MerkleVerification {
  uint64 seq = 1;
  bool valid = 2;
  string root = 3;
  string recomputed_root = 4;
  int64 job_count = 5;
  string reason = 6;
}

message MerkleReport {
  repeated MerkleCheckpoint checkpoints = 1;
  repeated MerkleVerification verifications = 2;
  string latest_root = 3;
}

message GetJobChainRequest {
  string job_id = 1;
}

// ---------------------------------------------------------------- events

message GetMerkleCheckpointsRequest {
  int64 limit = 1;
}

message EventStreamRequest {
  // Restrict the stream to these job ids.
  repeated string job_ids = 1;
  // Restrict the stream to these session ids.
  repeated string session_ids = 2;
  // Filter by event type.
  repeated string types = 3;
  // Resume the stream after this event id.
  string last_event_id = 4;
}

message EventMessage {
  // task.done, task.failed, job.done, worker.lost, reauth, error, session.opened,
  // session.ready, session.task.done, session.task.failed or session.closed.
  // error is the terminal frame of a mid-stream fault (WO R17-ENVELOPE).
  string type = 1;
  string job_id = 2;
  string session_id = 3;
  string task_id = 4;
  string tab_id = 5;
  string worker_id = 6;
  google.protobuf.Timestamp at = 7;
  TaskResult result = 8;
  ErrorDetail error = 9;
  Job job = 10;
  Session session = 11;
  LeaseReceipt lease_receipt = 12;
  // Monotonic stream position, usable as the resume cursor.
  string event_id = 13;
}

// ---------------------------------------------------------------- sessions

message SessionTabGpu {
  bool webgpu = 1;
  string adapter = 2;
  google.protobuf.Struct limits = 3;
}

message SessionTab {
  string tab_id = 1;
  string host_id = 2;
  string worker_id = 3;
  // warming, ready, busy, draining, closed or lost.
  string state = 4;
  // GPU report of this tab; GPU is a capability, never a separate pool.
  SessionTabGpu gpu = 5;
  // Concurrent task slots of this tab.
  int64 slots = 6;
}

message OpenSessionRequest {
  // Number of browser tabs to lease.
  int64 tab_count = 1;
  // Number of tab hosts (wwHosts) to span.
  int64 host_count = 2;
  Pin pin = 3;
  // Artifact loaded and initialised in every leased tab before the session
  // reports state open.
  string warm_initializer_artifact_id = 4;
  google.protobuf.Struct warm_initializer_args = 5;
  int64 warm_timeout_ms = 6;
  // Session lease lifetime; on expiry the tabs return to the pool.
  int64 ttl_seconds = 7;
  // cpu, gpu or gpu-preferred.
  string needs = 8;
  repeated string module_artifact_ids = 9;
  SessionOptions options = 10;
  google.protobuf.Struct metadata = 11;
  // Client key; resubmitting the same key returns the original session.
  string idempotency_key = 12;
}

message SessionOptions {
  DewOptions dew = 1;
  P2POptions p2p = 2;
  UploadCheckOption upload_checks = 3;
}

message GetSessionRequest {
  string session_id = 1;
}

message CloseSessionRequest {
  string session_id = 1;
  string reason = 2;
  int64 grace_ms = 3;
  // Let running tasks finish before the tabs are released.
  bool drain = 4;
}

message StreamSessionTasksRequest {
  string session_id = 1;
  // Tasks to append to the session; dispatched in batches.
  repeated TaskSpec tasks = 2;
  // Tasks grouped per worker round trip.
  int64 batch_size = 3;
  // Map of artifact id to per-task slice size in bytes.
  map<string, int64> chunksize = 4;
  // cpu, gpu or gpu-preferred.
  string needs = 5;
  // partial, fail-fast or threshold.
  string policy = 6;
  double threshold = 7;
  int64 max_attempts = 8;
  // low, normal or high.
  string priority = 9;
  // Keep a group of tasks inside one process.
  GroupBy group_by = 10;
  // Bind this batch to a session, tabs or hosts.
  Pin pin = 11;
  // Share of tasks in percent re-sent to other workers and compared by exact
  // hash; an admin may refuse.
  double rerun_percent = 12;
  SessionTaskOptions options = 13;
  google.protobuf.Struct metadata = 14;
}

message SessionTaskOptions {
  int64 task_timeout_ms = 1;
  int64 max_task_bytes = 2;
  repeated string tags = 3;
  bool tolerance_compare = 4;
  string comparator_artifact_id = 5;
  TamperEvidenceOption tamper_evidence = 6;
  DewOptions dew = 7;
  P2POptions p2p = 8;
}

message SessionTaskBatch {
  string session_id = 1;
  string job_id = 2;
  string batch_id = 3;
  // accepted, partially-accepted or rejected.
  string state = 4;
  int64 task_count = 5;
  repeated string accepted_task_ids = 6;
  repeated string rejected_task_ids = 7;
  repeated Warning warnings = 8;
  google.protobuf.Timestamp accepted_at = 9;
}

message Session {
  string session_id = 1;
  // Job id of the job that owns this session, when one was opened with it.
  string job_id = 2;
  // opening, open, draining, closed, failed or expired.
  string state = 3;
  int64 tab_count = 4;
  int64 host_count = 5;
  bool pinned = 6;
  Pin pin = 7;
  string warm_initializer_artifact_id = 8;
  // not-requested, pending, warming, warm or failed.
  string warm_state = 9;
  repeated SessionTab tabs = 10;
  JobProgress progress = 11;
  repeated Warning warnings = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp expires_at = 14;
  google.protobuf.Timestamp closed_at = 15;
}

// ---------------------------------------------------------------- capabilities

message Capabilities {
  message ServerLimits {
    int64 max_tasks_per_job = 1;
    // Inline payload ceiling; 262144 bytes equals 256 KiB.
    int64 max_inline_bytes = 2;
    int64 max_batch_size = 3;
    int64 max_task_bytes = 4;
    int64 max_task_duration_ms = 5;
    int64 max_artifact_bytes = 6;
    // Server default batch size per device class.
    map<string, int64> default_batch_size = 7;
  }

  message Gpu {
    bool supported = 1;
    bool webgpu_required = 2;
    string adapter = 3;
    google.protobuf.Struct limits = 4;
    int64 task_timeout_ms = 5;
    int64 memory_limit_bytes = 6;
  }

  message Quotas {
    int64 running_jobs = 1;
    int64 queued_tasks = 2;
    int64 requests_per_minute = 3;
    int64 task_bytes = 4;
    int64 task_time_ms = 5;
    bool priority_high_allowed = 6;
  }

  message Sessions {
    bool supported = 1;
    int64 max_tabs_per_session = 2;
    int64 max_hosts_per_session = 3;
    int64 max_session_ttl_seconds = 4;
    bool warm_initializer_supported = 5;
    int64 warm_timeout_ms = 6;
  }

  message Rerun {
    bool available = 1;
    double default_percent = 2;
    double max_percent = 3;
    bool tolerance_compare_available = 4;
  }

  message TamperEvidence {
    bool security_log_enabled = 1;
    bool per_job_chain_available = 2;
    bool merkle_available = 3;
  }

  message UploadChecks {
    bool format_size_hash = 1;
    bool import_permission_scan = 2;
    bool review_gate = 3;
    bool malware_abuse_scan = 4;
  }

  message P2P {
    bool enabled = 1;
    // Always hash-addressed-only.
    string share_mode = 2;
    // Always true; results always return to the server.
    bool results_to_server = 3;
  }

  message Dew {
    bool enabled = 1;
    // 24 h window by default.
    int64 receipt_window_seconds = 2;
    // For example ed25519.
    string receipt_algorithm = 3;
  }

  string server_id = 1;
  string pool_id = 2;
  string api_version = 3;
  ServerLimits server_limits = 4;
  Gpu gpu = 5;
  Quotas quotas = 6;
  repeated string priority_classes = 7;
  Sessions sessions = 8;
  Rerun rerun = 9;
  TamperEvidence tamper_evidence = 10;
  UploadChecks upload_checks = 11;
  P2P p2p = 12;
  Dew dew = 13;
}

message GetCapabilitiesRequest {}

// ---------------------------------------------------------------- errors

// Error details in google.rpc style: a stable code, a trace id and a retryable
// flag, carried in google.rpc.Status details on both transports.
message ErrorDetail {
  // Stable machine-readable code from one documented list shared by REST, SSE
  // and gRPC.
  string code = 1;
  // Trace id for the failed call.
  string trace_id = 2;
  // Whether the caller may retry the same request.
  bool retryable = 3;
  // Human-readable summary.
  string message = 4;
  // Longer explanation of the failure.
  string detail = 5;
  // HTTP-equivalent status used by the REST surface.
  int32 status = 6;
  // URI reference identifying the problem type.
  string type = 7;
  // Title of the problem.
  string title = 8;
  // Instance URI of the failed request.
  string instance = 9;
  // Retry after seconds, when the failure is rate limited.
  int64 retry_after_seconds = 10;
  // Actionable hint for the caller; additive in WO R17-ENVELOPE.
  string hint = 11;
  // Correlation id of the failed call, additive in WO R17-ENVELOPE; trace_id
  // keeps its historical meaning.
  string request_id = 12;
}
